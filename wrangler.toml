name = "zmanim"
main = "api/src/index.js"
compatibility_date = "2026-10-01"

# Static files in ./web: the public site at the root, the admin UI in /admin/.
# Both only talk to the API over HTTP, so either can move to its own project.
[assets]
directory = "./web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true   # the Worker strips BASE_PATH before looking up a file

[[d1_databases]]
binding = "DB"
database_name = "zmanim"
database_id = "978af130-5d6b-407e-9b9e-85a85ac785ce"
migrations_dir = "api/migrations"

# Files attached to messages (shared SMT bucket; this project keeps them under zmanim/chat/)
[[r2_buckets]]
binding = "FILES"
bucket_name = "smt"

[vars]
# Comma-separated front-end origins allowed to call the API from another domain.
# Empty = any origin (safe: auth is a Bearer token, not a cookie).
ALLOWED_ORIGINS = ""
# Path prefix when served from a shared domain (smti.uk/zmanim). The workers.dev root keeps working too.
BASE_PATH = "/zmanim"

# No cron trigger: the free plan allows only 5 per account. Expired sessions are
# cleaned up during logins instead (see auth.js).
workers_dev = true

[observability]
enabled = true
