name = "zmanim"
main = "api/src/index.js"
compatibility_date = "2026-10-01"

# The admin UI is plain static files in ./admin. It is served by this same Worker for now,
# but it only talks to the API over HTTP, so it can be moved to its own project at any time
# (see README: "Separating the admin UI").
[assets]
directory = "./admin"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "zmanim"
database_id = "978af130-5d6b-407e-9b9e-85a85ac785ce"
migrations_dir = "api/migrations"

[vars]
# Comma-separated front-end origins allowed to call the API from another domain.
# Empty = any origin (safe: auth is a Bearer token, not a cookie).
ALLOWED_ORIGINS = ""

# Daily cleanup of expired sessions and old login attempts
[triggers]
crons = ["17 3 * * *"]

[observability]
enabled = true
