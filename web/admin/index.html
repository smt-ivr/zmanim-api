<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>ניהול זמני מניינים</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f5bd3'/%3E%3Cpath d='M16 7v9l6 4' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    { "imports": {
        "preact": "./vendor/preact.js",
        "preact/hooks": "./vendor/preact-hooks.js",
        "htm": "./vendor/htm.js"
    } }
  </script>
  <!-- API location. Same origin by default; set apiBase when the UI is hosted elsewhere. -->
  <script src="config.js"></script>
</head>
<body>
  <div id="app"><div class="boot">טוען…</div></div>
  <script>
    // If the app fails to start, show why instead of an endless "loading".
    (function () {
      function show(msg) {
        var el = document.getElementById('app');
        if (el && el.querySelector('.boot')) el.innerHTML = '<div class="boot" style="flex-direction:column;gap:8px;text-align:center;padding:16px"><b>שגיאה בטעינת המערכת</b><code dir="ltr" style="white-space:pre-wrap">' + String(msg).replace(/</g, '&lt;') + '</code></div>';
      }
      window.addEventListener('error', function (e) { show((e.message || 'error') + (e.filename ? ' @ ' + e.filename + ':' + e.lineno : '') || (e.target && e.target.src)); }, true);
      window.addEventListener('unhandledrejection', function (e) { show(e.reason && e.reason.message || e.reason); });
      setTimeout(function () { show('הטעינה לוקחת יותר מדי זמן. ייתכן שהדפדפן ישן מדי (נדרש Chrome/Safari עדכני)'); }, 12000);
    })();
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
